[package]
name = "disasm-wasm"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "The core as a WebAssembly module with a plain C ABI and no imports, so any host can run it: a browser, Node, Electron, wasmtime."

[lib]
crate-type = ["cdylib"]
path = "src/lib.rs"

[dependencies]
disasm-core = { path = "../core" }
